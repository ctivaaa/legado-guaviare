@if (!started()) {
  <app-intro-gate (start)="onStart()" />
}

<div class="bg-layer" [style.background-color]="tracker.bgColor()"></div>

<!-- El contenido existe desde el principio (lo leen buscadores y lectores de
     pantalla sin hacer clic en "Empezar"); mientras la pantalla de inicio está
     encima queda inerte: sin foco, sin clics y sin teclas. -->
<app-stamp-nav [attr.inert]="started() ? null : ''" />

<main [attr.inert]="started() ? null : ''">
  <app-era-journey [active]="started()" />
</main>
