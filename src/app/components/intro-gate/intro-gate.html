<video class="intro-bg" src="assets/videoDinero.mp4" poster="assets/mascara-fajos.jpeg" [muted]="true" autoplay loop playsinline aria-hidden="true"></video>
<div class="intro-overlay" aria-hidden="true"></div>
<div class="intro-grain" aria-hidden="true"></div>
<div class="intro-inner">
  <p class="intro-eyebrow">un proyecto de @kawede — Guaviare, Colombia</p>
  <h1>El Legado</h1>
  <p class="intro-sub">cuatro generaciones. una hoja. la historia contada hacia atrás.</p>

  <button type="button" class="intro-btn" #startBtn (click)="onStart()">
    <span>Empezar</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7" /></svg>
  </button>

  <p class="intro-hint">usa el scroll o las flechas del teclado para avanzar — o deja que avance solo</p>

  <div class="intro-audio-note">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 14a8 8 0 0 1 16 0" />
      <rect x="3" y="14" width="4" height="6" rx="1.5" />
      <rect x="17" y="14" width="4" height="6" rx="1.5" />
    </svg>
    <span>este sitio usa audio — se recomiendan audífonos</span>
  </div>
</div>
