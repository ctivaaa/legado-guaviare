<div class="closing__inner">
  <p class="closing__kicker">{{ era().tag }}</p>
  <h2 class="closing__title">{{ era().title }}</h2>
  <p class="closing__text">{{ era().quote }}</p>
  <div class="closing__divider" aria-hidden="true"></div>

  <ul class="closing__credits">
    @for (c of credits; track c.role) {
      <li>{{ c.role }} — <span class="closing__name">{{ c.by }}</span></li>
    }
    <li>Un proyecto de <a class="closing__link" href="https://www.instagram.com/kawedecol/" target="_blank" rel="me noopener" (click)="click()">&#64;kawede</a> — Guaviare, Colombia</li>
  </ul>

  <a class="closing__portfolio" href="https://www.behance.net/gallery/221316011/Portafolio" target="_blank" rel="noopener" (click)="click()">
    
    Portafolio
  </a>

  <div class="closing__actions">
    <button type="button" class="btn btn--primary" (click)="restart()">Volver a ver desde el inicio</button>
    <button type="button" class="btn btn--ghost" (click)="share()">
      <span aria-live="polite">{{ copied() ? 'Enlace copiado' : 'Compartir este proyecto' }}</span>
    </button>
    <a class="btn btn--ghost" href="mailto:andresf.buitragov@gmail.com" (click)="click()">Trabajemos</a>
  </div>
</div>
