<header class="nav">
  <div class="brand-group">
    <h1 class="brand">El Legado <em>del Guaviare</em></h1>
  </div>
</header>

<!-- Barra de controles: siempre visible, checkbox para sonido y toggles
     circulares para avance automático / pantalla completa. -->
<div class="control-bar" role="group" aria-label="Controles de reproducción">
  @if (ambientAudio.available) {
    <button
      type="button"
      class="control-item"
      [class.checked]="!ambientAudio.muted()"
      [attr.aria-pressed]="!ambientAudio.muted()"
      [attr.aria-label]="ambientAudio.muted() ? 'Activar sonido ambiente' : 'Silenciar sonido ambiente'"
      (click)="toggleAudio($event)"
    >
      <span class="control-box" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" /></svg>
      </span>
      <span class="control-label">Sonido</span>
    </button>
    <span class="control-sep" aria-hidden="true"></span>
  }

  <button
    type="button"
    class="control-item"
    [class.checked]="autoScroll.active()"
    [attr.aria-pressed]="autoScroll.active()"
    [attr.aria-label]="autoScroll.active() ? 'Pausar avance automático' : 'Dejar que avance solo'"
    (click)="toggleAutoScroll($event)"
  >
    <span class="control-dot" aria-hidden="true"></span>
    <span class="control-label">Avance automático</span>
  </button>
  <span class="control-sep" aria-hidden="true"></span>

  <button
    type="button"
    class="control-item control-item--fullscreen"
    [class.checked]="isFullscreen()"
    [attr.aria-pressed]="isFullscreen()"
    [attr.aria-label]="isFullscreen() ? 'Salir de pantalla completa' : 'Pantalla completa'"
    (click)="toggleFullscreen($event)"
  >
    <span class="control-dot" aria-hidden="true"></span>
    <span class="control-label">Pantalla completa</span>
  </button>
</div>

<p class="sr-only" role="status">{{ announcement() }}</p>

<nav class="epochs" [class.open]="menuOpen()" aria-label="Ir a una época">
  <button
    type="button"
    class="epochs-head"
    aria-controls="epochs-list"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu($event)"
  >
    <span class="epochs-kicker">Ir a una época</span>
    <span class="epochs-count">
      {{ tracker.activeIndex() + 1 }} de {{ entries().length }}
      <svg class="epochs-chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.5l4 4 4-4" /></svg>
    </span>
  </button>

  <ol class="epochs-list" id="epochs-list">
    @for (entry of entries(); track entry.id; let i = $index) {
      <li>
        <button
          type="button"
          class="epoch"
          [class.active]="i === tracker.activeIndex()"
          [class.pending]="entry.pending"
          [style.--dot]="entry.accent"
          [attr.aria-current]="i === tracker.activeIndex() ? 'step' : null"
          [attr.tabindex]="menuOpen() ? 0 : -1"
          (click)="goTo(entry.id, $event)"
        >
          <span class="epoch-label">{{ entry.label }}</span>
          <span class="epoch-dot" aria-hidden="true"></span>
        </button>
      </li>
    }
  </ol>
</nav>
